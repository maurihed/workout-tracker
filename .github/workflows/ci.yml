name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: gym_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gym" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://gym:gym@localhost:5432/gym_test?schema=public
      AUTH_SECRET: ci-secret
      AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.5.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - name: Create shadow database
        run: |
          node -e "const {Client}=require('pg');(async()=>{const c=new Client({connectionString:'postgresql://gym:gym@localhost:5432/postgres'});await c.connect();try{await c.query('CREATE DATABASE gym_shadow')}catch(e){if(e.code!=='42P04')throw e}await c.end()})().catch(e=>{console.error(e);process.exit(1)})"
      - name: Prisma migration drift check
        env:
          SHADOW_DATABASE_URL: postgresql://gym:gym@localhost:5432/gym_shadow?schema=public
        run: pnpm exec prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm build
